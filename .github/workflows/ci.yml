name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          # Resolve to the newest patch release: the cached manifest lagged a
          # security release and govulncheck failed on a fixed stdlib.
          check-latest: true
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache: true

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          # config verify fetches a JSON schema over the network and flakes on
          # timeouts; `run` still parses+validates the config and lints the code.
          verify: false

  vulncheck:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  hadolint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: hadolint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: tanuki:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm tanuki:ci version
          docker run --rm tanuki:ci help
          echo "image size: $(docker image inspect tanuki:ci --format '{{.Size}}' | numfmt --to=iec)"

      - name: Rewriting works end to end
        run: |
          docker volume create tanuki-ci >/dev/null
          run() { docker run --rm -v tanuki-ci:/data tanuki:ci "$@"; }
          run init ci
          run add example.com
          run test "ping example.com" | tee /tmp/out.txt
          fiction=$(sed -n '/Real -> Fiction/,/^$/p' /tmp/out.txt)
          echo "$fiction" | grep -q "localhost:" || { echo "::error::domain was not rewritten"; exit 1; }
          ! echo "$fiction" | grep -q "example\.com" || { echo "::error::real domain leaked through rewrite"; exit 1; }

      - name: Mappings verify clean
        run: |
          run() { docker run --rm -v tanuki-ci:/data tanuki:ci "$@"; }
          run verify || { echo "::error::tanuki verify reported a leak"; exit 1; }

      - name: Verify flags an unmapped target
        run: |
          printf 'contact security@unmapped-target.io at 93.184.216.34\n' > /tmp/report.md
          status=0
          docker run --rm -v tanuki-ci:/data -v /tmp/report.md:/r.md:ro tanuki:ci verify /r.md \
            > /tmp/verify.txt 2>&1 || status=$?
          cat /tmp/verify.txt
          if [ "$status" -eq 0 ]; then
            echo "::error::verify passed a report holding unmapped targets"
            exit 1
          fi
          # A non-zero exit alone proves nothing: a crash or "no engagement"
          # would pass this step too. Both values have to be named.
          for want in unmapped-target.io 93.184.216.34; do
            grep -qF "$want" /tmp/verify.txt || {
              echo "::error::verify did not report $want"
              exit 1
            }
          done
