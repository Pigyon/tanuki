name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          # config verify fetches a JSON schema over the network and flakes on
          # timeouts; `run` still parses+validates the config and lints the code.
          verify: false

  vulncheck:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  hadolint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [Dockerfile, Dockerfile.dev]
    steps:
      - uses: actions/checkout@v7

      - uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          config: .hadolint.yaml

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: hadolint
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: tanuki:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm tanuki:ci version
          docker run --rm tanuki:ci help
          echo "image size: $(docker image inspect tanuki:ci --format '{{.Size}}' | numfmt --to=iec)"

      - name: Rewriting works end to end
        run: |
          docker volume create tanuki-ci >/dev/null
          run() { docker run --rm -v tanuki-ci:/data tanuki:ci "$@"; }
          run init ci
          run add example.com
          run test "ping example.com" | tee /tmp/out.txt
          fiction=$(sed -n '/Real -> Fiction/,/^$/p' /tmp/out.txt)
          echo "$fiction" | grep -q "localhost:" || { echo "::error::domain was not rewritten"; exit 1; }
          ! echo "$fiction" | grep -q "example\.com" || { echo "::error::real domain leaked through rewrite"; exit 1; }
