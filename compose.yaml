services:
  tanuki:
    # Published image from GitHub Container Registry.
    # Pin a release instead of latest for reproducibility:
    #   TANUKI_TAG=0.1.0 docker compose up -d
    # To build from source instead, see compose.dev.yaml.
    image: ghcr.io/pigyon/tanuki:${TANUKI_TAG:-latest}
    container_name: tanuki
    ports:
      - "127.0.0.1:18080:18080"
    volumes:
      - tanuki-data:/data
      - ./.claude:/workspace/.claude
    working_dir: /workspace
    environment:
      - TANUKI_DATA=/data
      - TANUKI_PROXY_PORT=18080
      - TANUKI_UPSTREAM=https://api.anthropic.com
      # Owner for a .claude/ directory Docker had to create as root. An
      # existing directory keeps its own owner. Set these if your uid is not 1000.
      - TANUKI_UID=${TANUKI_UID:-1000}
      - TANUKI_GID=${TANUKI_GID:-1000}
      ## Custom fiction org name (default: DEVTARGET):
      #- TANUKI_FICTION_ORG=ACMECORP
      ## Pre-seed target domains (comma-separated):
      #- TANUKI_DOMAINS=example.com,api.example.com
      ## Pre-seed target IPs (comma-separated):
      #- TANUKI_IPS=93.184.216.34
      ## In-scope domains (comma-separated, covers subdomains). Domains in
      ## scope get org/email/path/cloud mappings; anything else that is
      ## detected is mapped by hostname only. Empty means everything detected
      ## is treated as a target:
      #- TANUKI_SCOPE=example.com,example.org
      ## Custom rewrite rules (semicolon-separated, pipe-delimited real|fiction):
      #- TANUKI_RULES=John Smith|Jane Developer;Project Phoenix|Test Alpha
      ## Domains never treated as targets (comma-separated, covers subdomains):
      #- TANUKI_IGNORE=example-cdn.net
      ## Forward instead of refusing when a real value survives the rewrite.
      ## For diagnosing a false positive; it gives up the fail-closed guarantee:
      #- TANUKI_ON_LEAK=warn
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The container runs as root but .claude/ belongs to you: DAC_OVERRIDE lets
    # it write there, CHOWN hands the files it writes back to you.
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
    read_only: true
    restart: unless-stopped

volumes:
  tanuki-data:
