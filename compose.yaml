services:
  tanuki:
    # Published image from GitHub Container Registry.
    # Pin a release instead of latest for reproducibility:
    #   TANUKI_TAG=0.1.0 docker compose up -d
    # To build from source instead, see compose.dev.yaml.
    image: ghcr.io/pigyon/tanuki:${TANUKI_TAG:-latest}
    container_name: tanuki
    ports:
      - "127.0.0.1:18080:18080"
    volumes:
      - tanuki-data:/data
      - ./.claude:/workspace/.claude
    working_dir: /workspace
    environment:
      - TANUKI_DATA=/data
      - TANUKI_PROXY_PORT=18080
      - TANUKI_UPSTREAM=https://api.anthropic.com
      ## Custom fiction org name (default: DEVTARGET):
      #- TANUKI_FICTION_ORG=ACMECORP
      ## Pre-seed target domains (comma-separated):
      #- TANUKI_DOMAINS=example.com,api.example.com
      ## Pre-seed target IPs (comma-separated):
      #- TANUKI_IPS=93.184.216.34
      ## Custom rewrite rules (semicolon-separated, pipe-delimited real|fiction):
      #- TANUKI_RULES=John Smith|Jane Developer;Project Phoenix|Test Alpha
      ## Forward instead of refusing when a real value survives the rewrite.
      ## For diagnosing a false positive; it gives up the fail-closed guarantee:
      #- TANUKI_ON_LEAK=warn
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    restart: unless-stopped

volumes:
  tanuki-data:
